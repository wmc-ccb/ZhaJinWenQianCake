name: build-mac

# macOS 云端构建：PyInstaller 不支持跨平台，mac 包必须在 macos runner
# 上构建。手动触发或推 tag 时跑；产物挂到对应 Release。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-macos:
    runs-on: macos-15-arm64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖（mac 轮子集）
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements-mac.txt || true

      - name: 下载模型（构建时打入包内，含 face_landmarker.task）
        run: python tools/fetch_models.py

      - name: 生成 mac PyInstaller spec
        run: |
          cat > ZhaJinWenQianCake-mac.spec << 'SPEC'
          # -*- mode: python ; coding: utf-8 -*-
          # macOS 构建规格：由 CI 生成（人工维护见 BUILD-MAC.md）
          import os
          ROOT = os.path.abspath(os.path.dirname(SPEC))
          datas = [(os.path.join(ROOT, "ui"), "ui")]
          hidden = [
              "webview", "webview.platforms.cocoa", "webview.platforms.edgechromium",
              "uvicorn.logging", "uvicorn.loops", "uvicorn.loops.auto",
              "uvicorn.loops.asyncio", "uvicorn.protocols",
              "uvicorn.protocols.http", "uvicorn.protocols.http.auto",
              "uvicorn.protocols.http.h11_impl", "uvicorn.protocols.websockets",
              "uvicorn.protocols.websockets.auto", "uvicorn.lifespan",
              "uvicorn.lifespan.on", "onnxruntime", "mediapipe",
              "mediapipe.tasks", "mediapipe.tasks.python",
              "mediapipe.tasks.python.vision", "rawpy", "engine.updater",
              "engine.meshface",
          ]
          for m in ("engine.autofix", "engine.automask", "engine.batch", "engine.bgclean",
                    "engine.brush", "engine.cattree", "engine.cliponnx", "engine.comfy_mgr",
                    "engine.models_setup", "engine.handfoot", "engine.beach", "engine.tunnel",
                    "engine.updater", "engine.meshface", "engine.objectpick", "engine.skintone",
                    "engine.exportfx", "engine.crop", "engine.curves", "engine.defringe",
                    "engine.eyes", "engine.face", "engine.faceparse", "engine.formula",
                    "engine.genfill", "engine.gentools", "engine.geoface", "engine.grade",
                    "engine.grading", "engine.grassfix", "engine.history", "engine.idphoto",
                    "engine.imgutil", "engine.lama", "engine.landmarks", "engine.lgroup",
                    "engine.library", "engine.liquify", "engine.local", "engine.match",
                    "engine.matting", "engine.nndenoise", "engine.passersby", "engine.paths",
                    "engine.pet", "engine.pipeline", "engine.pose", "engine.portrait",
                    "engine.rawexif", "engine.rawio", "engine.rigfix", "engine.scene",
                    "engine.semantic", "engine.skin", "engine.sky", "engine.superres",
                    "engine.tether", "engine.tone", "engine.wheel", "engine.wpd", "engine.blend"):
              hidden.append(m)
          a = Analysis(
              [os.path.join(ROOT, "tools", "launch.py")],
              pathex=[ROOT], binaries=[], datas=datas,
              hiddenimports=hidden, hookspath=[], hooksconfig={},
              runtime_hooks=[], excludes=["tkinter", "pytest"], noarchive=False)
          pyz = PYZ(a.pure)
          exe = EXE(pyz, a.scripts, [], exclude_binaries=True,
                    name="ZhaJinWenQianCake", debug=False, strip=False, upx=False,
                    console=False, icon=None)
          coll = COLLECT(exe, a.binaries, a.datas, strip=False, upx=False,
                         name="ZhaJinWenQianCake")
          SPEC
          echo "spec written"

      - name: PyInstaller 构建
        run: python -m PyInstaller ZhaJinWenQianCake-mac.spec --noconfirm --clean

      - name: 组装 mac 发行目录
        run: |
          mkdir -p dist/ZhaJinWenQianCake/models dist/ZhaJinWenQianCake/out
          # 模型不入包：首启由应用按 models_manifest.json 下载（单包分发）
          cp tools/models_manifest.json dist/ZhaJinWenQianCake/
          cp tools/install_generative.py dist/ZhaJinWenQianCake/ 2>/dev/null || true
          tar -czf ZhaJinWenQianCake-v*-macos.tar.gz -C dist ZhaJinWenQianCake

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ZhaJinWenQianCake-macos
          path: ZhaJinWenQianCake-v*-macos.tar.gz

      - name: 挂到 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload "${GITHUB_REF_NAME}" ZhaJinWenQianCake-v*-macos.tar.gz \
            --clobber -R "$GITHUB_REPOSITORY" || echo "release 不存在，仅保留 artifact"
        env:
          GH_TOKEN: ${{ github.token }}
